<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TERMINAL // PACIENTE 0</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="terminal">

  <!-- LOGIN -->
  <div id="login">
  <p>TERMINAL DE LABORATORIO // ACCESO RESTRINGIDO</p>
  <p>Introduce credenciales:</p>

  <form id="loginForm">
  <div class="linea">
    <span>USUARIO:</span>
    <input type="text" id="alias" required>
  </div>

  <div class="linea">
    <span>CLAVE:</span>
    <input type="password" id="clave" required>
  </div>

  <!-- Botón invisible para activar el Enter -->
  <button type="submit" class="submitOculto"></button>

  <p id="error" class="error"></p>
</form>

</div>

  <!-- TERMINAL -->
  <div id="sistema" class="oculto">
    <p id="saludo"></p>
    <div class="contenedor">
      <div id="listaCapitulos"></div>
      <div class="visorCapitulo">
        <div id="mensajes"></div>
        <div id="opciones"></div>
      </div>
    </div>
  </div>

</div>

<script src="Inicio.js"></script>
</body>
</html>
